# rayfield.yml chains base: roblox, adding the executor globals we feature-detect.
# CI generates roblox.yml via `selene generate-roblox-std` before linting.
std = "rayfield"

[lints]
# Luau supports \u{XXXX} escapes; selene's Lua parser does not know them and flags every
# one as "string escape sequence doesn't exist". The strings are correct - the middot in
# changelog.luau and the multiplication sign in reorderlist.luau both render live.
bad_string_escape = "allow"
# We intentionally guard optional executor globals in boolean context.
global_usage = "allow"
# Shadowing is used deliberately in a few builders (local window = self.window etc).
shadowing = "allow"
# One-liner `if x then ... end` is the house style throughout the UI code.
multiple_statements = "allow"
# UDim2.new with explicit scale+offset is used deliberately; not always convertible.
roblox_manual_fromscale_or_fromoffset = "allow"
mixed_table = "allow"
# Unit specs intentionally monkeypatch Roblox globals in the Lune shim.
incorrect_standard_library_use = "allow"
# lint regenerates the roblox std from Roblox's live API each run, so their deprecation
# flags drift under us. KeyCode.Unknown is our unbound sentinel and stays valid at runtime.
deprecated = "allow"
